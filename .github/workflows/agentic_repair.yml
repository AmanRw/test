name: AgenticCode Autonomous Issue Resolution

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "The issue number to resolve"
        required: true
        type: string
      max_iterations:
        description: "Maximum repair retry loops"
        required: false
        default: "3"
        type: string

jobs:
  resolve-issue:
    # Triggers on new issues, issues labeled 'agentic-fix', comments starting with /fix, or manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (github.event.action == 'opened' || contains(github.event.issue.labels.*.name, 'agentic-fix'))) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/fix'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout External Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AgenticCode Issue Resolver
        uses: AmanRw/AgenticCode@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          issue_number: ${{ github.event.issue.number || inputs.issue_number }}
          max_iterations: ${{ inputs.max_iterations || '3' }}